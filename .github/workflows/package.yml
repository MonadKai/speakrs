name: Package

on:
  workflow_dispatch: {}
  push:
    branches:
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - master

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  crate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
          prefix-key: v1-rust

      - name: Confirm x86_64 host
        shell: bash
        run: |
          set -euo pipefail
          host="$(rustc -vV | sed -n 's/^host: //p')"
          case "$host" in
            x86_64-*) ;;
            *) echo "expected x86_64 host, got $host" >&2; exit 1 ;;
          esac

      - name: Package crate
        run: |
          rm -rf target/package
          cargo package --locked

      - name: Check packaged manifest
        shell: bash
        run: |
          set -euo pipefail

          package_dir="$(find target/package -mindepth 1 -maxdepth 1 -type d -name 'speakrs-*' -print -quit)"
          test -n "$package_dir"

          metadata="$RUNNER_TEMP/speakrs-package-metadata.json"
          cargo metadata --manifest-path "$package_dir/Cargo.toml" --format-version 1 --no-deps > "$metadata"

          normal_dependencies="$(
            jq -r '
              .packages[]
              | select(.name == "speakrs")
              | .dependencies[]
              | select(.kind == null and .target == null)
              | .name
            ' "$metadata" | sort -u
          )"

          missing=0
          for dependency in crossbeam-channel libloading ort rayon thiserror tracing; do
            if ! grep -Fxq "$dependency" <<< "$normal_dependencies"; then
              echo "dependency is not a normal dependency: $dependency" >&2
              missing=1
            fi
          done

          exit "$missing"

      - name: Check packaged crate as a dependency
        shell: bash
        run: |
          set -euo pipefail

          package_dir="$(find target/package -mindepth 1 -maxdepth 1 -type d -name 'speakrs-*' -print -quit)"
          test -n "$package_dir"

          consumer="$RUNNER_TEMP/speakrs-package-consumer"
          mkdir -p "$consumer/src"

          cat > "$consumer/Cargo.toml" <<EOF
          [package]
          name = "speakrs-package-consumer"
          version = "0.0.0"
          edition = "2024"
          publish = false

          [dependencies]
          speakrs = { path = "$PWD/$package_dir" }
          EOF

          cat > "$consumer/src/lib.rs" <<'EOF'
          pub fn execution_mode() -> speakrs::ExecutionMode {
              speakrs::ExecutionMode::Cpu
          }
          EOF

          cargo check --manifest-path "$consumer/Cargo.toml"
