name: CI

on:
  workflow_dispatch: {}
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  SPEAKRS_MODEL_FIXTURE_REV: 5d24ffee75f13fb061fa6d10944a64e2dc1d5e6f

jobs:
  clippy:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            features: cuda migraphx load-dynamic _metrics
          - os: macos-latest
            features: coreml cuda migraphx load-dynamic _metrics
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
          prefix-key: v1-rust

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --features "${{ matrix.features }}" -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
          prefix-key: v1-rust

      - name: Cache model fixtures
        uses: actions/cache@v4
        with:
          path: fixtures/models
          key: ${{ runner.os }}-speakrs-model-fixtures-${{ env.SPEAKRS_MODEL_FIXTURE_REV }}

      - name: Download model fixtures
        shell: bash
        run: |
          set -euo pipefail

          base_url="https://huggingface.co/avencera/speakrs-models/resolve/${SPEAKRS_MODEL_FIXTURE_REV}"
          files=(
            plda_lda.npy
            plda_mean1.npy
            plda_mean2.npy
            plda_mu.npy
            plda_psi.npy
            plda_tr.npy
            segmentation-3.0.onnx
            wespeaker-voxceleb-resnet34.min_num_samples.txt
            wespeaker-voxceleb-resnet34.onnx
            wespeaker-voxceleb-resnet34.onnx.data
          )

          mkdir -p fixtures/models
          for file in "${files[@]}"; do
            path="fixtures/models/${file}"
            if [[ ! -s "$path" ]]; then
              curl --retry 3 --retry-delay 5 -LfsS "${base_url}/${file}" -o "$path"
            fi
          done

          for file in "${files[@]}"; do
            test -s "fixtures/models/${file}"
          done

      - name: Run tests
        run: cargo test --workspace
