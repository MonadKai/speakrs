name: DiarizeFile
options:
  bundleIdPrefix: com.avencera.speakrs.sample
  deploymentTarget:
    iOS: "15.0"
packages:
  Speakrs:
    path: ../..
targets:
  DiarizeFile:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: Sources
    resources:
      - path: ../../../../fixtures/test_short.wav
    dependencies:
      - package: Speakrs
    settings:
      base:
        CODE_SIGNING_ALLOWED: "NO"
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        PRODUCT_BUNDLE_IDENTIFIER: com.avencera.speakrs.sample.DiarizeFile
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
