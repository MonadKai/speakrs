[build-system]
requires = ["maturin>=1.14,<2"]
build-backend = "maturin"

[project]
name = "speakrs"
version = "0.5.0"
description = "Fast speaker diarization with native Rust execution"
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "Apache-2.0"
authors = [{ name = "Praveen Perera" }]
keywords = ["speaker", "diarization", "audio", "pyannote", "onnx"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
]
dependencies = [
    "onnxruntime>=1.23,<1.24; platform_system == 'Linux' and python_version < '3.14'",
    "onnxruntime>=1.25,<1.28; platform_system == 'Linux' and python_version >= '3.14'",
    "onnxruntime>=1.23,<1.24; platform_system == 'Darwin' and platform_machine == 'x86_64' and python_version < '3.14'",
]

[project.scripts]
speakrs = "speakrs.cli:main"

[project.optional-dependencies]
test = ["pytest>=8", "numpy>=1.23"]

[project.urls]
Repository = "https://github.com/avencera/speakrs"
Documentation = "https://docs.rs/speakrs"

[tool.maturin]
module-name = "speakrs._native"
python-source = "python"
no-default-features = true
features = ["pyo3/extension-module", "online", "portable-linalg"]
