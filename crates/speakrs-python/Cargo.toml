[package]
name = "speakrs-python"
version = "0.5.0"
edition = "2024"
rust-version = "1.88"
description = "Python bindings for speakrs"
license = "Apache-2.0"
repository = "https://github.com/avencera/speakrs"
authors = ["Praveen Perera"]
publish = false

[lib]
name = "speakrs_native"
crate-type = ["cdylib"]

[features]
default = ["online", "default-linalg"]
coreml = ["speakrs-sdk/coreml"]
cuda = ["speakrs-sdk/cuda-pipeline"]
migraphx = ["speakrs-sdk/migraphx-pipeline"]
default-linalg = ["speakrs-sdk/pipeline"]
online = ["speakrs-sdk/online"]
portable-linalg = ["speakrs-sdk/portable-pipeline"]

[dependencies]
pyo3 = { version = "0.29.0", features = ["extension-module"] }
speakrs-sdk = { path = "../speakrs-sdk" }
